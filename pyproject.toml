[project]
name = "mojo-gmpy2"
version = "0.1.0"
description = "Multiprecision integer and rational arithmetic with Mojo kernels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "gmpy2", "multiprecision", "integer", "rational"]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "gmpy2"]

[project.urls]
Homepage = "https://github.com/lee101/mojo-gmpy2"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
